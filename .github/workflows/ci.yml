name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal application
        run: ./scripts/package.sh
      - name: Build native WidgetKit extension (unsigned)
        run: >-
          xcodebuild -project CodexQuota.xcodeproj -scheme CodexQuota
          -configuration Release -derivedDataPath work/ci-widget-build
          CODE_SIGNING_ALLOWED=NO build
      - name: Test parsing and transport
        run: ./scripts/test.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Quota-macOS
          path: |
            dist/Codex-Quota-macOS.zip
            dist/SHA256SUMS.txt
